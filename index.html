<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ATM GROUP Attendance</title><style>:root{--bg:#0b1018;--panel:#141c27;--line:#2a3645;--text:#f5f7fb;--muted:#9ba8b8;--blue:#2563eb;--orange:#f49a1d}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top,#1b2e4b,#0b1018 58%);color:var(--text)}.hidden{display:none!important}.screen{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:rgba(20,28,39,.97);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 55px #0006}.login-card{width:min(430px,100%);padding:30px;text-align:center}.logo-box{width:210px;height:145px;margin:0 auto 18px;background:#fff;border-radius:14px;padding:8px}.logo-box img{width:100%;height:100%;object-fit:contain}.title{font-size:28px;font-weight:900}.title span{color:var(--orange)}.muted{color:var(--muted);font-size:13px}.field{text-align:left;margin:14px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.field input,.field select{width:100%;background:#0c131d;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px}.error{height:20px;color:#fca5a5;font-size:12px;margin-top:8px}button{border:0;border-radius:10px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#303b4a}button.orange{background:var(--orange)}.full{width:100%}.company-card{width:min(900px,100%);padding:30px;text-align:center}.companies{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:25px 0}.company-btn{background:#101923;border:1px solid var(--line);border-radius:15px;padding:24px;text-align:left;cursor:pointer}.company-btn:hover{border-color:var(--blue)}.company-btn b{font-size:18px}.badge{display:inline-block;padding:4px 8px;border-radius:8px;background:#24334a;color:#cfe1ff;font-size:10px;font-weight:800;margin-bottom:7px}.app{max-width:1550px;margin:auto;padding:18px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.stat{padding:15px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:5px}.tabs{display:flex;gap:8px;margin-bottom:14px}.panel{padding:16px}.toolbar{display:flex;gap:9px;align-items:end;flex-wrap:wrap;margin-bottom:14px}.toolbar .field{margin:0;min-width:180px}.month-title{font-size:18px;font-weight:900;margin:8px 0 12px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{border-collapse:collapse;width:100%;min-width:1100px}.table th,.table td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px;text-align:center;white-space:nowrap}.table th{background:#10161f;color:#b8c3d1;position:sticky;top:0;z-index:1}.day{width:40px}.cell{cursor:pointer;font-weight:900;user-select:none}.p{background:#14532d;color:#bbf7d0}.a{background:#7f1d1d;color:#fecaca}.empty{background:#29323d;color:#9ca8b5}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.toast{position:fixed;right:18px;bottom:18px;background:#fff;color:#111;padding:12px 16px;border-radius:10px;display:none;font-weight:800}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.companies{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.app{padding:10px}}</style></head><body>
<section id="loginScreen" class="screen"><div class="card login-card"><div class="logo-box"><img src="logo.svg" alt="ATM GROUPS"></div><div class="title">ATM <span>GROUP</span></div><p class="muted">Attendance Management System</p><div class="field"><label>Login ID</label><input id="loginId" autocomplete="username" placeholder="Enter Login ID"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter Password"></div><button class="full" id="loginBtn">Login</button><div id="loginError" class="error"></div></div></section>
<section id="companyScreen" class="screen hidden"><div class="card company-card"><div class="logo-box"><img src="logo.svg" alt="ATM GROUPS"></div><div class="title">Select <span>Company</span></div><p class="muted">Select the company for attendance.</p><div id="companyList" class="companies"></div><button class="secondary" id="addCompanyBtn">+ Add Company</button> <button class="secondary" id="companyLogoutBtn">Logout</button></div></section>
<section id="appScreen" class="hidden"><div class="app"><div class="topbar"><div><div class="title">ATM <span>GROUP</span> Attendance</div><div id="selectedCompany" class="muted"></div></div><div class="top-actions"><button class="secondary" id="changeCompanyBtn">Change Company</button><button class="secondary" id="logoutBtn">Logout</button></div></div><div class="stats"><div class="card stat"><small>Employees</small><strong id="totalEmployees">0</strong></div><div class="card stat"><small>Present Today</small><strong id="presentToday">0</strong></div><div class="card stat"><small>Absent Today</small><strong id="absentToday">0</strong></div><div class="card stat"><small>Attendance</small><strong id="attendancePercent">0%</strong></div></div><div class="tabs"><button id="attendanceTabBtn">Attendance</button><button class="secondary" id="masterTabBtn">Employees Master</button></div><div id="attendancePanel" class="card panel"><div class="toolbar"><div class="field"><label>Date</label><input id="attendanceDate" type="date"></div><button id="markAllP">Mark All P</button><button class="secondary" id="markAllA">Mark All A</button><button class="orange" id="saveBtn">Save Attendance</button></div><div id="sheetTitle" class="month-title"></div><div id="attendanceTable" class="table-wrap"></div></div><div id="masterPanel" class="card panel hidden"><h3>Add New Joining</h3><div class="form-grid"><div class="field"><label>Employee Name</label><input id="employeeName" placeholder="Employee name"></div><div class="field"><label>Gender</label><select id="employeeGender"><option>Male</option><option>Female</option></select></div><div class="field"><label>Company</label><input id="employeeCompany" readonly></div><div class="field"><label>Employment Type</label><select id="employeeType"><option>Regular</option><option>Cash</option></select></div></div><button class="orange" id="addEmployeeBtn">Save New Joining</button><p class="muted">Employee ID is generated automatically by Google Apps Script.</p><div id="masterTable" class="table-wrap"></div></div></div></section><div id="toast" class="toast"></div>
<script>'use strict';const API='https://script.google.com/macros/s/AKfycbzYoCsWFTno4mV4dUEcfC1CpObjQyph1wsoA5N2Uc6WLagGPPfNX90AM7CoX-X9FFRPVw/exec',LOGIN_ID='mr.ashish',LOGIN_PASSWORD='atm2026',DEFAULT_COMPANIES=['Saideep Precision','Pinnacle Polymers'];let selectedCompany='',employees=[],statuses={};const $=id=>document.getElementById(id);function today(){return new Date().toISOString().slice(0,10)}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function show(id){['loginScreen','companyScreen','appScreen'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',2200)}async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data})});const text=await r.text();try{return JSON.parse(text)}catch(e){throw new Error('Invalid Google Apps Script response')}}function login(){if($('loginId').value.trim()===LOGIN_ID&&$('loginPassword').value===LOGIN_PASSWORD){sessionStorage.setItem('atm_logged_in','1');$('loginError').textContent='';loadCompanies()}else $('loginError').textContent='Invalid Login ID or Password'}async function loadCompanies(){show('companyScreen');let cs=[...DEFAULT_COMPANIES];try{const d=await api('getCompanies');if(d.ok&&Array.isArray(d.companies)&&d.companies.length)cs=d.companies}catch(e){}$('companyList').innerHTML=cs.map(c=>`<div class="company-btn" data-company="${esc(c)}"><span class="badge">COMPANY</span><br><b>${esc(c)}</b><p class="muted">Open monthly attendance</p></div>`).join('');document.querySelectorAll('.company-btn').forEach(b=>b.onclick=()=>openCompany(b.dataset.company))}async function openCompany(c){selectedCompany=c;$('selectedCompany').textContent='Company: '+c;$('employeeCompany').value=c;show('appScreen');await loadAttendance()}function dim(v){const d=new Date(v+'T12:00:00');return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}function mlabel(v){return new Date(v+'T12:00:00').toLocaleString('en-IN',{month:'short',year:'numeric'})}async function loadAttendance(){$('attendanceTable').innerHTML='<div style="padding:25px;text-align:center;color:#9ba8b8">Loading...</div>';try{const d=await api('getAttendance',{company:selectedCompany,date:$('attendanceDate').value});if(!d.ok)throw new Error(d.error||'Load failed');employees=Array.isArray(d.employees)?d.employees:[];statuses=d.statuses&&typeof d.statuses==='object'?d.statuses:{};renderAll()}catch(e){employees=[];statuses={};renderAll();toast('Google Sheet connection failed')}}function renderAll(){renderAttendance();renderMaster();renderStats()}function renderAttendance(){const days=dim($('attendanceDate').value);$('sheetTitle').textContent=selectedCompany+' Attendance ('+mlabel($('attendanceDate').value)+')';let h='<table class="table"><thead><tr><th>Sr.No.</th><th>Employee Name</th><th>Gender</th><th>Type (R/C)</th>';for(let d=1;d<=days;d++)h+=`<th class="day">${d}</th>`;h+='<th>Present Days</th><th>Absent Days</th><th>Total Days</th></tr></thead><tbody>';if(!employees.length)h+='<tr><td colspan="40">No active employees</td></tr>';else employees.forEach((e,i)=>{const type=e.type==='Cash'?'C':'R';let p=0,a=0;h+=`<tr><td>${i+1}</td><td>${esc(e.name)}</td><td>${esc(e.gender)}</td><td>${type}</td>`;for(let d=1;d<=days;d++){const k=e.id+'|'+d,s=statuses[k]||'';if(s==='P')p++;if(s==='A')a++;h+=`<td class="cell ${s==='P'?'p':s==='A'?'a':'empty'}" data-id="${esc(e.id)}" data-day="${d}">${s||'—'}</td>`}h+=`<td>${p}</td><td>${a}</td><td>${p+a}</td></tr>`});h+='</tbody></table>';$('attendanceTable').innerHTML=h;document.querySelectorAll('.cell').forEach(c=>c.onclick=()=>cycle(c.dataset.id,Number(c.dataset.day)))}function cycle(id,d){const k=id+'|'+d,s=statuses[k]||'';statuses[k]=s===''?'P':s==='P'?'A':'';renderAll()}function markAll(v){const days=dim($('attendanceDate').value);employees.forEach(e=>{for(let d=1;d<=days;d++)statuses[e.id+'|'+d]=v});renderAll()}function renderStats(){const day=new Date($('attendanceDate').value+'T12:00:00').getDate(),p=employees.filter(e=>statuses[e.id+'|'+day]==='P').length,a=employees.filter(e=>statuses[e.id+'|'+day]==='A').length;$('totalEmployees').textContent=employees.length;$('presentToday').textContent=p;$('absentToday').textContent=a;$('attendancePercent').textContent=employees.length?Math.round(p/employees.length*100)+'%':'0%'}async function saveAttendance(){try{const d=await api('saveAttendance',{company:selectedCompany,date:$('attendanceDate').value,statuses});if(!d.ok)throw new Error(d.error||'Save failed');toast('Attendance saved successfully')}catch(e){toast('Attendance save failed')}}async function addEmployee(){const name=$('employeeName').value.trim();if(!name)return toast('Enter employee name');try{const d=await api('addEmployee',{name,gender:$('employeeGender').value,company:selectedCompany,joiningDate:$('attendanceDate').value,employmentType:$('employeeType').value,addedFrom:'App'});if(!d.ok)throw new Error(d.error||'Add failed');$('employeeName').value='';toast('Employee '+d.employeeId+' added');await loadAttendance();showMaster()}catch(e){toast('Could not add employee')}}function renderMaster(){let h='<table class="table"><thead><tr><th>Sr.No.</th><th>Employee ID</th><th>Employee Name</th><th>Gender</th><th>Company</th><th>Type</th><th>Status</th></tr></thead><tbody>';employees.forEach((e,i)=>h+=`<tr><td>${i+1}</td><td>${esc(e.id)}</td><td>${esc(e.name)}</td><td>${esc(e.gender)}</td><td>${esc(e.company)}</td><td>${esc(e.type||'Regular')}</td><td>Active</td></tr>`);if(!employees.length)h+='<tr><td colspan="7">No active employees</td></tr>';h+='</tbody></table>';$('masterTable').innerHTML=h}function showAttendance(){$('attendancePanel').classList.remove('hidden');$('masterPanel').classList.add('hidden');$('attendanceTabBtn').className='';$('masterTabBtn').className='secondary'}function showMaster(){$('attendancePanel').classList.add('hidden');$('masterPanel').classList.remove('hidden');$('attendanceTabBtn').className='secondary';$('masterTabBtn').className=''}function logout(){sessionStorage.removeItem('atm_logged_in');selectedCompany='';employees=[];statuses={};show('loginScreen')}$('loginBtn').onclick=login;$('loginPassword').onkeydown=e=>{if(e.key==='Enter')login()};$('companyLogoutBtn').onclick=logout;$('logoutBtn').onclick=logout;$('changeCompanyBtn').onclick=loadCompanies;$('attendanceTabBtn').onclick=showAttendance;$('masterTabBtn').onclick=showMaster;$('markAllP').onclick=()=>markAll('P');$('markAllA').onclick=()=>markAll('A');$('saveBtn').onclick=saveAttendance;$('addEmployeeBtn').onclick=addEmployee;$('attendanceDate').onchange=loadAttendance;$('addCompanyBtn').onclick=()=>toast('Company management will be added later');$('attendanceDate').value=today();show('loginScreen');\nasync function googleApi(action,payload={}){\n  const r=await fetch(GOOGLE_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})});\n  return await r.json();\n}\n\nconst oldSelectCompany=selectCompany;\nselectCompany=async function(c){\n  selectedCompany=c; $('company').value=c; $('selectedCompanyLabel').textContent=`Company: ${c}`; show('appScreen'); render();\n  try{\n    const d=await googleApi('getAttendance',{company:c,date:$('date').value});\n    if(d.ok && Array.isArray(d.employees)){\n      db.employees=d.employees.map(e=>({id:e.id,name:e.name,gender:e.gender,company:e.company,active:true}));\n      db.attendance[key()]={...(db.attendance[key()]||{}),...(d.statuses||{})};\n      localStorage.setItem(KEY,JSON.stringify(db)); render(); toast('Google Sheet connected');\n    }\n  }catch(e){ toast('Google Sheet connection failed'); }\n};\n\n$('saveBtn').onclick=async()=>{\n  try{\n    await googleApi('saveAttendance',{company:selectedCompany,date:$('date').value,statuses:db.attendance[key()]||{}});\n    persist(); toast('Attendance saved to Google Sheet');\n  }catch(e){ persist(); toast('Saved locally; Sheet connection failed'); }\n};\n\n$('addEmployee').onclick=async()=>{\n  const name=$('empName').value.trim(),gender=$('gender').value;\n  if(!name)return toast('Enter employee name');\n  try{\n    const d=await googleApi('addEmployee',{name,gender,company:selectedCompany,joiningDate:$('date').value,employmentType:'Regular',addedFrom:'Attendance'});\n    if(!d.ok)throw new Error(d.error||'Add failed');\n    $('empName').value='';\n    const a=await googleApi('getAttendance',{company:selectedCompany,date:$('date').value});\n    if(a.ok) db.employees=a.employees.map(e=>({id:e.id,name:e.name,gender:e.gender,company:e.company,active:true}));\n    localStorage.setItem(KEY,JSON.stringify(db)); render(); toast('New employee added to Master');\n  }catch(e){ toast('Could not add employee to Google Sheet'); }\n};\n</script></body></html>
